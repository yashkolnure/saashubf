server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Dynamic backend routes — must come before the SPA catch-all
  location = /sitemap.xml {
    proxy_pass http://backend:5011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://backend:5011/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Bot renderer — proxy crawler requests for listing/blog pages to backend
  # so Googlebot gets real HTML instead of the empty React shell
  location ~* ^/(listings|blog)/[^/]+$ {
    proxy_pass http://backend:5011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_intercept_errors on;
    error_page 404 = @spa;
  }

  location @spa {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
}
